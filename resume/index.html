    <style>
      * {
        box-sizing: border-box;

      html,

        width: 100%;
        height: 100%;

      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        background: #0f172a;
        color: #f8fafc;

        justify-content: center;

        color: #020617;
        font-size: 0.9rem;
        font-weight: 800;
        line-height: 1;
        text-decoration: none;
      }

      .resume-frame {
        display: block;
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        border: 0;
        background: #111827;
      }

      @media (max-width: 520px) {
        .resume-toolbar {
          align-items: stretch;
          flex-direction: column;
          gap: 0.75rem;
        }

        .resume-actions {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
